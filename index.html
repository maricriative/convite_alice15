<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Convite XV Anos — Maria Vitória</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Valores padrão. Para mudar cores e fontes, edite CONFIG.paleta e CONFIG.fontes no script. */
:root{
  --fundo:#FBF3F5; --card:#FFFAFB; --secaoAlt:#F7E6EA;
  --claro:#F1CCD4; --rosa:#E6A9BA; --antigo:#D299A2; --salmao:#E3A1A8;
  --enfase:#8A4E5B; --texto:#5E2F3A; --textoSuave:#85535F; --textoClaro:#FFF7F8;
  --f-tit:'Achetta','Italiana',serif; --f-script:'Barsela Calligraphy','Pinyon Script',cursive; --f-corpo:'Montserrat',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{background:var(--fundo);color:var(--texto);font-family:var(--f-corpo);font-weight:300;font-size:15px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img,video,iframe{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h2{font-family:var(--f-tit);font-weight:400;font-size:2.1rem;line-height:1.2;text-align:center;color:var(--enfase)}
h3{font-family:var(--f-tit);font-weight:400;font-size:1.5rem;color:var(--enfase)}
h3.script,.script{font-family:var(--f-script);font-weight:400;font-size:2.3rem;line-height:1.1}
.sub{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;text-align:center;color:var(--textoSuave);font-weight:500}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 26px;color:var(--antigo);font-size:11px}
.orn::before,.orn::after{content:"";width:44px;height:1px;background:var(--antigo)}
.texto{font-size:1.02rem;color:var(--textoSuave)}
.data{font-family:var(--f-tit);font-size:1.15rem;color:var(--enfase)}
/* Data da capa em tamanho maior (ajuste aqui se quiser maior ou menor) */
.data-capa{font-size:1.75rem;line-height:1.25}

section.sec{padding:64px 22px;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.veu{position:absolute;inset:0;z-index:1}
.wrap,.capa-card{position:relative;z-index:2}
section.alt{background:var(--secaoAlt)}
.wrap{max-width:480px;margin:0 auto;text-align:center}
.ev{margin-top:34px}
.ev+.ev{padding-top:34px;border-top:1px solid var(--antigo)}
/* Cartão de cada evento (com fundo próprio opcional) */
.ev-card{position:relative;overflow:hidden;margin-top:30px;padding:34px 20px;border:1px solid var(--antigo)}
.ev-conteudo{position:relative;z-index:2}
.ev-nome{font-family:var(--f-tit);font-weight:400;font-size:1.9rem;line-height:1.15;color:var(--enfase)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;border-radius:99px;border:1px solid var(--enfase);color:var(--enfase);
  text-decoration:none;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.cheio{background:var(--enfase);color:var(--textoClaro);width:100%}

/* Foto da debutante na moldura em formato de porta (arco no topo) */
.foto{width:100%;max-width:280px;aspect-ratio:2/3;object-fit:cover;margin:30px auto 8px;
  border-radius:140px 140px 6px 6px;border:3px solid var(--antigo);padding:6px;background:var(--card);
  outline:1px solid var(--rosa);outline-offset:6px;box-shadow:0 12px 30px rgba(138,78,91,.25)}

/* Galeria */
.carrossel{position:relative;width:100%;max-width:300px;aspect-ratio:3/4;margin:0 auto;overflow:hidden;border:3px solid var(--antigo);box-shadow:0 10px 26px rgba(138,78,91,.2)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.slide.ativo{opacity:1;z-index:1}
.slide img{width:100%;height:100%;max-width:none;object-fit:cover}
.pontos{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;gap:6px;justify-content:center}
.pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);transition:.3s}
.pontos i.ativo{background:var(--enfase);transform:scale(1.25)}

/* Dress code: bolinhas de cores */
.cores{display:flex;gap:12px;justify-content:center;margin-top:20px}
.cores i{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* Abertura */
#intro{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--enfase);
  background:var(--claro) center/cover no-repeat;transition:transform 1.1s cubic-bezier(.77,0,.18,1),opacity .8s}
#intro.open{transform:translateY(-100%);opacity:0}
#introVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:10;display:none;background:#000}
.intro-nome{font-family:var(--f-script);font-size:clamp(3rem,16vw,4.6rem);line-height:1}
.selo{width:104px;height:104px;border-radius:50%;background:var(--enfase);color:var(--textoClaro);border:3px solid var(--card);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;font-weight:500}
.selo-clique{width:130px;height:130px;border-radius:50%;background:transparent}

#menu{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:0 16px;padding-top:env(safe-area-inset-top,0px);
  background:var(--enfase);transform:translateY(-100%);transition:transform .4s;scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
#menu.show{transform:none}
#menu a{white-space:nowrap;text-decoration:none;font-size:.78rem;font-weight:500;padding:6px 14px;border-radius:99px;color:var(--claro);border:1px solid var(--antigo)}

/* Capa */
.hero{position:relative;overflow:hidden;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:36px 20px;background:var(--fundo) center/cover no-repeat}
.capa-card{width:100%;max-width:400px;text-align:center;padding:10px}
.capa-card .nome{font-family:var(--f-script);font-size:clamp(2.8rem,14vw,4rem);line-height:1.05;color:var(--enfase);margin:8px 0}
.frase{font-family:var(--f-tit);font-size:1.08rem;color:var(--texto);margin:16px 0 4px;line-height:1.45}

/* Bloco escuro (contagem) com borda de renda e laço */
.escuro{background:var(--enfase);color:var(--textoClaro);padding:90px 22px}
.escuro h2{color:var(--textoClaro)}
.escuro .sub{color:var(--claro)}
.escuro::before,.escuro::after{content:"";position:absolute;left:0;right:0;height:16px;background:var(--renda,none) repeat-x;background-size:auto 100%;z-index:3}
.escuro::before{top:0}
.escuro::after{bottom:0;transform:scaleY(-1)}
.cd{display:flex;justify-content:center;gap:16px}
.cd b{display:block;font-family:var(--f-tit);font-weight:400;font-size:2.1rem;line-height:1}
.cd span{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--claro)}

/* Linha do tempo */
.tl{position:relative;text-align:left}
.tl::before{content:"";position:absolute;left:103px;top:10px;bottom:10px;width:1px;background:var(--antigo)}
.tl-i{display:grid;grid-template-columns:84px 18px 1fr;gap:10px;margin-bottom:26px;align-items:start}
.tl-h{font-family:var(--f-tit);font-size:1.35rem;color:var(--enfase);text-align:right;line-height:1.1}
.tl-h small{display:block;font-family:var(--f-corpo);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--textoSuave)}
.tl-d{color:var(--antigo);font-size:.8rem;text-align:center}
.tl-t b{display:block;font-family:var(--f-tit);font-weight:400;font-size:1.15rem;color:var(--enfase)}
.tl-t span{font-size:.85rem;color:var(--textoSuave)}

/* Confirmar presença */
.rsvp-ico{width:84px;height:84px;border-radius:50%;background:var(--enfase);color:var(--textoClaro);display:grid;place-items:center;margin:8px auto 4px;border:4px solid var(--claro)}
.rsvp-ico svg{width:40px;height:40px}
.rsvp-ico img{width:44px;height:44px;object-fit:contain}
.revelar{max-height:0;overflow:hidden;opacity:0;transition:max-height .8s ease,opacity .6s ease}
.revelar.aberto{max-height:1000px;opacity:1}
form{display:grid;gap:14px;margin-top:18px;text-align:left}
label{display:grid;gap:4px;font-size:.8rem;color:var(--enfase);font-weight:500}
input,select,textarea{font:inherit;padding:10px 2px;border:none;border-bottom:1px solid var(--antigo);border-radius:0;background:transparent;color:var(--texto);width:100%;outline:none}
textarea{min-height:70px}

footer{background:var(--enfase);color:var(--textoClaro);text-align:center;padding:52px 20px calc(52px + env(safe-area-inset-bottom,0px))}
footer .script{font-size:2.8rem}
footer p{letter-spacing:.2em;font-size:.8rem;color:var(--claro)}
#musicBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--antigo);background:var(--enfase);color:var(--textoClaro);font-size:1.1rem;display:grid;place-items:center}
#musicBtn.tocando{animation:giro 6s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
#ytwrap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
.logo-nome{display:block;width:80%;max-width:300px;height:auto;margin:10px auto}
.logo-nome.branca{filter:brightness(0) invert(1)}
</style>
</head>
<body class="locked">
<div id="ytwrap"><div id="yt"></div></div>
<div id="intro" role="dialog"></div>
<nav id="menu"></nav>
<main id="app"></main>
<button id="musicBtn" title="Música">♪</button>

<script>
/* ==========================================================================
   ✏️ CONFIGURAÇÕES — XV ANOS MARIA VITÓRIA
   EM TODAS AS SEÇÕES VOCÊ PODE USAR:
     fundo: imagem, GIF ou vídeo .mp4 (o vídeo toca sozinho, mudo e em loop). "" = sem fundo.
     cor:   cor de fundo da seção, em hexadecimal (ex.: "#F1CCD4"). "" = cor padrão da seção.
     veu:   de 0 a 1, cobre o fundo (imagem/vídeo) com a cor da seção para dar leitura ao texto:
            0 = sem véu, 0.5 = metade, 1 = cobre tudo.
   ========================================================================== */
const CONFIG = {
  nome: "Maria Vitória",
  logoNome: "https://github.com/maricriative/convite_MariaVitoria15Anos/blob/main/ID%20VISUAL%20MARIA%20VITORIA_Prancheta%201.png?raw=true",            // opcional: imagem PNG da logo do nome (substitui o texto na abertura e na capa)
  logoRodape: "",          // opcional: OUTRA logo do nome só para o rodapé (acima da hashtag). Vazio = usa a logoNome
  logoRodapeBranca: true,  // true = a logo do rodapé fica branca sobre o fundo escuro; false = cores originais
  hashtag: "#MariaVitóriaXV",
  cidade: "São Francisco - MG",
  celebracao: "Aniversário de Maria Vitória e de seu Vô Tone Veloso",

  /* 🎨 PALETA (identidade visual: #D299A2, #E6A9BA, #F1CCD4, #E3A1A8). Troque qualquer cor. */
  paleta: {
    fundo:       "#FBF3F5",  // fundo da página
    card:        "#FFFAFB",  // cartões e molduras
    secaoAlt:    "#F7E6EA",  // seções alternadas
    claro:       "#F1CCD4",  // rosa claro: renda, detalhes sobre fundo escuro
    rosa:        "#E6A9BA",  // filete interno das molduras
    antigo:      "#D299A2",  // bordas, linhas e ornamentos
    salmao:      "#E3A1A8",  // reserva (uso livre)
    enfase:      "#8A4E5B",  // títulos, botões, menu, blocos escuros
    texto:       "#5E2F3A",  // texto principal
    textoSuave:  "#85535F",  // texto secundário
    textoClaro:  "#FFF7F8"   // texto sobre fundo escuro
  },

  /* 🔤 FONTES: Achetta (títulos) e Barsela Calligraphy (nome/script).
     Se tiver os arquivos, coloque o nome aqui (.woff2, .ttf ou .otf, na mesma pasta do convite).
     Sem os arquivos, o convite usa fontes parecidas (Italiana e Pinyon Script). */
  fontes: { arquivoTitulo: "", arquivoScript: "" },

  /* Borda de renda: deixe "" para a renda desenhada, ou coloque uma imagem repetível (PNG) da identidade visual */
  renda: "",

  /* ✉️ ABERTURA */
  abertura: { usar: true, imagem: "", video: "", texto: "Toque para abrir" },

  /* 🎵 MÚSICA: arquivo mp3 (prioridade) ou link do YouTube */
  musica: "",
  youtube: "https://youtu.be/6_LsCe4jUF8?is=hUHBTJKa1Hb2_wkU",

  /* ---------- SEÇÕES (na ordem em que aparecem) ---------- */

  capa: {
    frase: "Nada acontece sem antes existir um sonho, e na idade dos sonhos tudo é possível!",
    fundo: "https://github.com/maricriative/convite_MariaVitoria15Anos/blob/main/Botanical_invitation_background_%E2%80%A6_4bbde213.jpg?raw=true", cor: "", veu: 0
  },
  dataTexto: "",   // opcional: sobrescreve o texto da data na capa (ex.: "08 e 09 de Janeiro de 2027")

  mensagem: {
    titulo: "Maria Vitória XV anos",
    texto: "Nunca deixe de sonhar, pois se podemos sonhar, também podemos tornar nossos sonhos realidade.",
    foto: "https://github.com/maricriative/convite_MariaVitoria15Anos/blob/main/WhatsApp%20Image%202026-11-19%20at%2011.33.27.jpeg?raw=true",   // foto da debutante, na moldura em formato de porta (ideal 840 x 1260 px, proporção 2:3)
    fundo: "https://github.com/maricriative/convite_MariaVitoria15Anos/blob/main/Novo%20Projeto%20(9).png?raw=true", cor: "", veu: 0
  },

  /* Conta até o primeiro evento; use null para ocultar. */
  contagem: { subtitulo: "Faltam", titulo: "Contagem regressiva", fundo: "", cor: "", veu: 0.0 },

  /* 📅 EVENTOS (alimentam a linha do tempo, os cartões de local e a contagem) */
  /* Cada evento vira um cartão na seção "Onde & Quando" e pode ter o seu próprio fundo:
       fundo: imagem, GIF ou vídeo .mp4 | cor: cor de fundo do cartão (ex.: "#F1CCD4") | veu: 0 a 1 */
  eventos: [
    { titulo: "Missa", dataHora: "2027-01-08T19:00:00", espaco: "Igreja Sagrada Família", endereco: "", mapsUrl: "",
      fundo: "", cor: "", veu: 0 },
    { titulo: "Baile", dataHora: "2027-01-09T20:00:00", espaco: "OAB São Francisco-MG",
      endereco: "Av. Montes Claros, 2550, João Aguiar - São Francisco",
      mapsUrl: "https://maps.app.goo.gl/kBrdsFXSnrKq6bA29?g_st=iw",
      fundo: "", cor: "", veu: 0 }
  ],

  /* Linha do tempo: por padrão usa os eventos. Para itens próprios: itens: [{hora:"19h00", dia:"08 jan", titulo:"", descricao:""}] */
  programacao: { titulo: "O Grande Dia", subtitulo: "Programação", itens: null, fundo: "", cor: "", veu: 0 },

  local: { titulo: "Onde & Quando", fundo: "", cor: "", veu: 0 },

  /* 👗 DRESS CODE: preencha "texto" para exibir a seção.
     cores: bolinhas de cores sugeridas (opcional), ex.: ["#F1CCD4", "#FFFFFF"] */
  dressCode: { titulo: "Dress Code", texto: "", cores: [], fundo: "", cor: "", veu: 0 },

  /* 🖼️ GALERIA: coloque os links das fotos entre aspas, separados por vírgula (ideal 900 x 1200 px, proporção 3:4).
     Exemplo: fotos: ["foto1.jpg", "https://.../foto2.jpg"]. Vazia = a seção não aparece. */
  galeria: {
    titulo: "Galeria",
    fotos: [
      ""
    ],
    fundo: "", cor: "", veu: 0
  },

  hospedagem: {
    titulo: "Onde se Hospedar",
    texto: "Sugestões de hotel e pousada para hospedagem:",
    lista: [
      { nome: "Hotel Supremo", link: "https://www.hotelsupremo.com.br/", botao: "Visitar site", imagem: "" },
      { nome: "Hotel Moriah", link: "https://www.instagram.com/hotelmoriah_/", botao: "Ver Instagram", imagem: "" }
    ],
    fundo: "", cor: "", veu: 0
  },

  presentes: { titulo: "Presentes", texto: "", itens: [], fundo: "", cor: "", veu: 0 },   // preencha "texto" ou "itens" para exibir

  rsvp: {
    titulo: "Confirmar Presença",
    chamada: "Toque no ícone para confirmar",
    iconeImagem: "",   // opcional: imagem PNG/SVG própria para o ícone. Vazio = usa o ícone de confirmação (✓) padrão
    mensagem: "Em breve a nossa assessoria entrará em contato para confirmar a sua presença e a dos seus acompanhantes:",
    whatsapp: "61986112425",   // ⚠️ número com DDI e DDD, ex.: "5538999999999". Vazio = mostra só a mensagem, sem formulário
    fundo: "https://github.com/maricriative/convite_MariaVitoria15Anos/blob/main/Floral_seamless_pattern_background_2abdf738.jpg?raw=true", cor: "", veu: 0
  }
};

/* ==========================================================================
   ⚙️ LÓGICA
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s), C = CONFIG, enc = encodeURIComponent, root = document.documentElement;
Object.entries(C.paleta || {}).forEach(([k, v]) => v && root.style.setProperty('--' + k, v));

/* fontes personalizadas */
const F = C.fontes || {}; let ff = '';
if (F.arquivoTitulo) ff += `@font-face{font-family:'Achetta';src:url("${F.arquivoTitulo}")}`;
if (F.arquivoScript) ff += `@font-face{font-family:'Barsela Calligraphy';src:url("${F.arquivoScript}")}`;
if (ff) { const st = document.createElement('style'); st.textContent = ff; document.head.appendChild(st); }

/* renda opcional: imagem repetível em faixa reta no topo e no rodapé do bloco escuro */
if (C.renda) root.style.setProperty('--renda', `url("${C.renda}")`);

/* utilitários */
const nomeHTML = (cls, branca, logo) => { const L = logo || C.logoNome; return L ? `<img class="logo-nome${branca && C.logoRodapeBranca !== false ? ' branca' : ''}" src="${L}" alt="${C.nome}">` : `<div class="${cls}">${C.nome}</div>`; };
const extrairId = u => { const m = (u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; };
const fm = (d, o) => new Intl.DateTimeFormat('pt-BR', o).format(d);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hora = d => fm(d, { hour: '2-digit', minute: '2-digit' }).replace(':', 'h');
const ev = C.eventos, d0 = new Date(ev[0].dataHora);
const dataTexto = C.dataTexto || (ev.map(e => fm(new Date(e.dataHora), { day: '2-digit' })).join(' e ') + ' de ' + cap(fm(d0, { month: 'long' })) + ' de ' + fm(d0, { year: 'numeric' }));
document.title = `${C.nome} — XV Anos`;

/* cor de fundo própria da seção (opcional) */
const corSec = c => c && c.cor ? ` style="background-color:${c.cor}"` : '';

/* fundo de seção: imagem, gif ou vídeo (+ véu opcional, na cor da seção) */
const fundoHTML = (c, cor) => {
  if (!c || !c.fundo) return '';
  const s = c.fundo, el = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(s) ? `<video class="bg" src="${s}" autoplay muted loop playsinline></video>` : `<img class="bg" src="${s}" alt="">`;
  return el + (c.veu > 0 ? `<div class="veu" style="background:${c.cor || cor};opacity:${c.veu}"></div>` : '');
};

/* 🎵 Música */
let audio = null, yt = null, tocando = false, quer = false;
const mb = $('#musicBtn');
if (C.musica) { audio = new Audio(C.musica); audio.loop = true; audio.volume = .7; }
else if (extrairId(C.youtube)) { const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); }
else mb.style.display = 'none';
function onYouTubeIframeAPIReady() {
  const id = extrairId(C.youtube);
  yt = new YT.Player('yt', { videoId: id, playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: id, playsinline: 1 }, events: { onReady: () => { if (quer) tocar(); } } });
}
function tocar() {
  quer = true;
  if (audio) audio.play().catch(() => {}); else if (yt && yt.playVideo) yt.playVideo(); else return;
  mb.classList.add('tocando'); tocando = true;
}
function pausar() { quer = false; if (audio) audio.pause(); else if (yt && yt.pauseVideo) yt.pauseVideo(); mb.classList.remove('tocando'); tocando = false; }
mb.onclick = () => tocando ? pausar() : tocar();

/* ✉️ Abertura */
const intro = $('#intro'), A = C.abertura || {};
function entrar() { intro.classList.add('open'); document.body.classList.remove('locked'); tocar(); setTimeout(() => intro.remove(), 1100); }
if (A.usar !== false) {
  let aberto = false;
  const abrir = () => {
    if (aberto) return; aberto = true; tocar();
    const v = $('#introVid');
    if (v) { v.style.display = 'block'; v.play(); v.onended = v.onclick = entrar; } else entrar();
  };
  if (A.imagem) intro.style.backgroundImage = `url("${A.imagem}")`;
  const vid = A.video ? `<video id="introVid" src="${A.video}" playsinline></video>` : '';
  intro.innerHTML = A.imagem
    ? `${vid}<button class="selo-clique" id="abrir" aria-label="Abrir convite"></button>`
    : `${vid}<p class="sub">XV Anos</p>${nomeHTML('intro-nome')}<button class="selo" id="abrir">${A.texto || 'Abrir'}</button>`;
  if (A.imagem) intro.onclick = abrir;
  $('#abrir').onclick = e => { e.stopPropagation(); abrir(); };
} else { intro.remove(); document.body.classList.remove('locked'); }

/* Seções */
const secoes = [], menu = [];
const CFG = { convite: C.mensagem, contagem: C.contagem, dia: C.programacao, local: C.local, traje: C.dressCode, galeria: C.galeria, hospedagem: C.hospedagem, presentes: C.presentes, confirmar: C.rsvp };
const sec = (id, rot, html, cls = '') => {
  const cor = cls.includes('escuro') ? 'var(--enfase)' : cls.includes('alt') ? 'var(--secaoAlt)' : 'var(--fundo)';
  secoes.push(`<section class="sec ${cls}" id="${id}"${corSec(CFG[id])}>${fundoHTML(CFG[id], cor)}<div class="wrap">${html}</div></section>`); if (rot) menu.push([id, rot]);
};
const tit = (t, s) => `${s ? `<p class="sub">${s}</p>` : ''}<h2>${t}</h2><div class="orn">♥</div>`;
/* ícone de confirmação (check dentro de um círculo) */
const ICONE_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3.2 3.2 5.8-6.4"/></svg>`;

const capa = `<header class="hero" id="inicio"${corSec(C.capa)}>${fundoHTML(C.capa, 'var(--fundo)')}
  <div class="capa-card">
    <p class="sub">${C.celebracao}</p>
    ${nomeHTML('nome')}
    <p class="sub">XV Anos</p>
    <p class="frase">“${C.capa.frase}”</p>
    <div class="orn">♥</div>
    <p class="data data-capa">${dataTexto}</p>
    <p class="sub" style="margin-top:6px">${C.cidade}</p>
    
  </div></header>`;

const M = C.mensagem;
if (M) sec('convite', 'Convite', `${tit(M.titulo)}<p class="texto">${M.texto}</p>${M.foto ? `<img class="foto" src="${M.foto}" alt="${C.nome}">` : ''}`);

if (C.contagem) sec('contagem', 'Contagem', `<p class="sub">${C.contagem.subtitulo || ''}</p><h2>${C.contagem.titulo}</h2><div id="cd" class="cd" style="margin-top:22px"></div>`, 'escuro');

const P = C.programacao;
if (P) {
  const itens = P.itens || ev.map(e => { const d = new Date(e.dataHora); return { hora: hora(d), dia: fm(d, { day: '2-digit', month: 'short' }).replace('.', ''), titulo: e.titulo, descricao: e.espaco }; });
  sec('dia', 'Programação', `${tit(P.titulo, P.subtitulo)}<div class="tl">${itens.map(i => `<div class="tl-i"><div class="tl-h">${i.hora}<small>${i.dia || ''}</small></div><div class="tl-d">♥</div><div class="tl-t"><b>${i.titulo}</b><span>${i.descricao || ''}</span></div></div>`).join('')}</div>`);
}

if (C.local) sec('local', 'Local', tit(C.local.titulo) + ev.map(e => {
  const d = new Date(e.dataHora), q = [e.espaco, e.endereco, C.cidade].filter(Boolean).join(' ');
  return `<div class="ev-card"${corSec(e)}>${fundoHTML(e, 'var(--secaoAlt)')}<div class="ev-conteudo"><p class="sub">${e.titulo}</p><h3 class="ev-nome">${e.espaco}</h3>
    <p class="data">${cap(fm(d, { weekday: 'long' }))}, ${fm(d, { day: 'numeric', month: 'long' })} · ${hora(d)}</p>
    ${e.endereco ? `<p class="texto" style="margin-top:6px">${e.endereco}</p>` : ''}
    <a class="btn" style="margin-top:16px" href="${e.mapsUrl || 'https://www.google.com/maps/search/?api=1&query=' + enc(q)}" target="_blank" rel="noopener">Como chegar</a></div></div>`;
}).join(''), 'alt');

const D = C.dressCode, coresD = D ? (D.cores || []).filter(Boolean) : [];
if (D && (D.texto || coresD.length)) sec('traje', 'Traje', `${tit(D.titulo)}${D.texto ? `<p class="texto">${D.texto}</p>` : ''}${coresD.length ? `<div class="cores">${coresD.map(c => `<i style="background:${c}"></i>`).join('')}</div>` : ''}`);

const GA = C.galeria, fotosG = GA ? (GA.fotos || []).filter(Boolean) : [];
if (fotosG.length) sec('galeria', 'Galeria', `${tit(GA.titulo || 'Galeria')}
  <div class="carrossel">${fotosG.map((g, i) => `<div class="slide${i ? '' : ' ativo'}"><img src="${g}" alt="Foto ${i + 1}" loading="lazy"></div>`).join('')}
  ${fotosG.length > 1 ? `<div class="pontos">${fotosG.map((_, i) => `<i class="${i ? '' : 'ativo'}"></i>`).join('')}</div>` : ''}</div>`, 'alt');

const H = C.hospedagem;
if (H) sec('hospedagem', 'Hospedagem', `${tit(H.titulo)}<p class="texto">${H.texto}</p>` + H.lista.map(h => `<div class="ev">${h.imagem ? `<img src="${h.imagem}" alt="${h.nome}" style="margin-bottom:14px">` : ''}<h3>${h.nome}</h3><a class="btn" style="margin-top:14px" href="${h.link}" target="_blank" rel="noopener">${h.botao || 'Saiba mais'}</a></div>`).join(''));

const G = C.presentes;
if (G && (G.texto || (G.itens || []).length)) sec('presentes', 'Presentes', `${tit(G.titulo)}${G.texto ? `<p class="texto">${G.texto}</p>` : ''}${(G.itens || []).length ? `<div class="ev">${G.itens.map(i => `<p class="texto">${i}</p>`).join('')}</div>` : ''}`, 'alt');

const R = C.rsvp;
if (R) sec('confirmar', 'Confirmar', `${tit(R.titulo)}<p class="texto">${R.chamada || ''}</p>
  <button class="rsvp-ico" id="rsvpBtn" aria-expanded="false" aria-controls="rsvpBox" aria-label="Confirmar presença">${R.iconeImagem ? `<img src="${R.iconeImagem}" alt="">` : ICONE_OK}</button>
  <div class="revelar" id="rsvpBox"><div class="ev"><p class="texto">${R.mensagem}</p>
  ${R.whatsapp ? `<form id="formRsvp">
    <label>Seu nome completo <input name="nome" required autocomplete="name"></label>
    <label>Você irá comparecer?<select name="presenca"><option value="sim">Sim, estarei lá!</option><option value="nao">Infelizmente não poderei ir</option></select></label>
    <label>Acompanhantes (nomes ou quantidade) <input name="acomp"></label>
    <label>Mensagem para a debutante <textarea name="recado"></textarea></label>
    <button class="btn cheio" type="submit">Confirmar no WhatsApp</button></form>` : ''}</div></div>`, 'alt');

$('#app').innerHTML = capa + secoes.join('') + `<footer>${nomeHTML('script', true, C.logoRodape)}<p>${C.hashtag}</p></footer>`;
$('#menu').innerHTML = menu.map(([id, r]) => `<a href="#${id}">${r}</a>`).join('');

/* Animações de entrada, menu, contagem */
const rvs = document.querySelectorAll('.wrap, footer');
rvs.forEach(e => e.classList.add('rv'));
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
  rvs.forEach(e => io.observe(e));
} else rvs.forEach(e => e.classList.add('in'));
addEventListener('scroll', () => $('#menu').classList.toggle('show', scrollY > innerHeight * .4), { passive: true });

function contagem() {
  const el = $('#cd'); if (!el) return;
  const dif = d0 - new Date();
  if (dif <= 0) { el.innerHTML = '<span style="font-size:.8rem">É HOJE!</span>'; return; }
  const n = [Math.floor(dif / 864e5), Math.floor(dif % 864e5 / 36e5), Math.floor(dif % 36e5 / 6e4), Math.floor(dif % 6e4 / 1e3)];
  el.innerHTML = n.map((v, i) => `<div><b>${String(v).padStart(2, '0')}</b><span>${['dias', 'horas', 'min', 'seg'][i]}</span></div>`).join('');
}
contagem(); setInterval(contagem, 1000);

/* Galeria: troca automática de fotos */
const slides = document.querySelectorAll('.slide'), pontos = document.querySelectorAll('.pontos i'); let cur = 0;
if (slides.length > 1) setInterval(() => {
  slides[cur].classList.remove('ativo'); pontos[cur].classList.remove('ativo');
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add('ativo'); pontos[cur].classList.add('ativo');
}, 4000);

/* Confirmar presença */
const rb = $('#rsvpBtn');
if (rb) rb.onclick = () => { const a = $('#rsvpBox').classList.toggle('aberto'); rb.setAttribute('aria-expanded', a); };
const form = $('#formRsvp');
if (form) form.onsubmit = e => {
  e.preventDefault();
  const f = new FormData(form), vai = f.get('presenca') === 'sim';
  let msg = `Olá! Sou ${f.get('nome')}. ` + (vai ? `Confirmo minha presença nos XV Anos de ${C.nome}.` : `Infelizmente não poderei comparecer.`);
  if (vai && f.get('acomp')) msg += `\nAcompanhantes: ${f.get('acomp')}`;
  if (f.get('recado')) msg += `\nRecado: ${f.get('recado')}`;
  open(`https://wa.me/${C.rsvp.whatsapp}?text=${enc(msg)}`, '_blank');
};
</script>
</body>
</html>
